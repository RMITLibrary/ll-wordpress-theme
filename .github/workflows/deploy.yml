name: Deploy to WP Engine

on:
  push:
    branches: [main, develop, staging]
  workflow_dispatch:

# Checkout is all this needs; the deploy itself goes over SSH, not the GitHub API.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      THEME_DIR: wp-content/themes/rmit-learning-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # ensure previous commit is available for diff checks

      # package.json and package-lock.json live at the repo root only.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22.18'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      # Sanity check: ensure your theme's vendor/rfs exists (no npm bootstrap)
      - name: Verify theme vendor/rfs
        run: |
          test -f "${THEME_DIR}/sass/bootstrap5/vendor/_rfs.scss" || {
            echo "Missing ${THEME_DIR}/sass/bootstrap5/vendor/_rfs.scss" >&2
            echo "Fix the path or make the import relative: @import \"./vendor/rfs\";" >&2
            exit 65
          }

      # Dependabot bumps the pinned MathJax in package.json; the theme copy must be re-vendored to match.
      - name: Verify vendored MathJax matches package.json
        run: |
          diff -q node_modules/mathjax/tex-chtml.js "${THEME_DIR}/mathjax/tex-chtml.js" &&
          diff -q node_modules/@mathjax/mathjax-newcm-font/chtml.js "${THEME_DIR}/mathjax/fonts/mathjax-newcm-font/chtml.js" &&
          diff -q node_modules/@mathjax/mathjax-mhchem-font-extension/chtml.js "${THEME_DIR}/mathjax/fonts/mathjax-mhchem-font-extension/chtml.js" || {
            echo "Vendored MathJax is out of date. Run: npm ci && npm run mathjax:vendor, then commit." >&2
            exit 65
          }

      # Dependabot bumps the pinned Fuse.js in package.json; the theme copy must match.
      - name: Verify vendored Fuse.js matches package.json
        run: |
          diff -q node_modules/fuse.js/dist/fuse.min.js "${THEME_DIR}/js/fuse/fuse.min.js" || {
            echo "Vendored Fuse.js is out of date. Run: npm ci && npm run fuse:vendor, then commit." >&2
            exit 65
          }

      # Same command as local builds, so CI and a local `npm run build` cannot drift.
      - name: Build CSS
        run: npm run build

      - name: Select WP Engine env
        run: |
          BRANCH="${GITHUB_REF##*/}"
          if [ "$BRANCH" = "main" ]; then
            echo "WPE_ENV=${{ secrets.WPE_ENV_PRD }}" >> $GITHUB_ENV
          elif [ "$BRANCH" = "develop" ]; then
            echo "WPE_ENV=${{ secrets.WPE_ENV_DEV }}" >> $GITHUB_ENV
          elif [ "$BRANCH" = "staging" ]; then
            echo "WPE_ENV=${{ secrets.WPE_ENV_STG }}" >> $GITHUB_ENV
          else
            echo "Unsupported branch: $BRANCH"; exit 1
          fi

      - name: Deploy theme to WP Engine
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ${{ env.WPE_ENV }}
          SRC_PATH: '${{ env.THEME_DIR }}/'
          REMOTE_PATH: '/${{ env.THEME_DIR }}/'
          CACHE_CLEAR: true
          # EXCLUDE: |
          #   node_modules
          #   **/*.map
